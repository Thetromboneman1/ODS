name: Sync Stable Upstream Release

on:
  schedule:
    - cron: "17 6 17 * *"
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: Stable tag, SHA, branch, or latest-release.
        required: false
        default: latest-release

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Osmantic/ODS
  DOWNSTREAM_BRANCH: boneman/macos-omlx
  REQUESTED_REF: ${{ inputs.upstream-ref || 'latest-release' }}

jobs:
  prepare:
    name: Resolve and reconstruct stable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      upstream-ref: ${{ steps.candidate.outputs.upstream_ref }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      changed: ${{ steps.candidate.outputs.changed }}
      conflict: ${{ steps.candidate.outputs.conflict }}
      conflicts-b64: ${{ steps.candidate.outputs.conflicts_b64 }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: boneman/macos-omlx
      - name: Resolve and reconstruct candidate without write credentials
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="$REQUESTED_REF"
          if [[ "$upstream_ref" == "latest-release" ]]; then
            upstream_ref=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          if [[ ${#upstream_ref} -gt 200 || ! "$upstream_ref" =~ ^[A-Za-z0-9._/-]+$ || "$upstream_ref" == -* || "$upstream_ref" == *..* || "$upstream_ref" == *@\{* ]]; then
            echo "::error::Invalid upstream ref"
            exit 1
          fi
          base=$(git rev-parse HEAD)
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$upstream_ref"
          upstream=$(git rev-parse FETCH_HEAD)
          changed=true; conflict=false; conflicts=""; conflicts_b64=""; tree=""
          if git merge-base --is-ancestor "$upstream" "$base"; then
            changed=false
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            set +e; git merge --no-edit "$upstream"; status=$?; set -e
            if [[ "$status" -ne 0 ]]; then
              changed=false; conflict=true
              conflicts=$(git diff --name-only --diff-filter=U | head -50)
              conflicts_b64=$(printf '%s' "$conflicts" | base64 | tr -d '\n')
              git merge --abort
            else
              tree=$(git rev-parse 'HEAD^{tree}')
            fi
          fi
          {
            echo "base=$base"
            echo "upstream_ref=$upstream_ref"
            echo "upstream=$upstream"
            echo "changed=$changed"
            echo "conflict=$conflict"
            echo "conflicts_b64=$conflicts_b64"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate exact stable candidate
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}
      - name: Validate candidate without secrets or write credentials
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          scripts/rebuild-downstream.sh --validate

  finalize:
    name: Publish exact validated review tree
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      UPSTREAM_REF: ${{ needs.prepare.outputs.upstream-ref }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - name: Publish validated tree without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git ls-remote origin "refs/heads/${DOWNSTREAM_BRANCH}" | awk '{print $1}')
          if [[ "$actual" != "$BASE_SHA" ]]; then
            echo "::error::Downstream advanced during validation; refusing stale publication"
            exit 1
          fi
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          existing=$(gh pr list --base "$DOWNSTREAM_BRANCH" --state open \
            --search "$UPSTREAM_SHA in:body" --json url,baseRefOid,headRefOid \
            --jq '.[0] | [.url, .baseRefOid, .headRefOid] | @tsv' || true)
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r existing_url existing_base existing_head <<< "$existing"
            if [[ "$existing_base" == "$BASE_SHA" && "$existing_head" =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --no-tags origin "$existing_head"
              if [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$EXPECTED_TREE" ]]; then
                echo "Existing exact synchronization PR: $existing_url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          branch="automation/upstream-sync-${UPSTREAM_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push --set-upstream origin "HEAD:refs/heads/$branch"
          body_file="$RUNNER_TEMP/ods-upstream-pr.md"
          {
            echo "Preserves \`deploy/boneman\`, validates \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\` in a read-only job, and publishes the exact validated tree from base \`${BASE_SHA}\`."
            echo
            echo "Production deployment remains manual."
          } > "$body_file"
          url=$(gh pr create --head "$branch" --base "$DOWNSTREAM_BRANCH" \
            --title "chore: review ODS ${UPSTREAM_REF}" --body-file "$body_file")
          if [[ "$(gh pr view "$url" --json baseRefOid --jq .baseRefOid)" != "$BASE_SHA" ]]; then
            gh pr close "$url" --delete-branch --comment "Closed automatically because the base branch advanced after validation."
            exit 1
          fi

  report-conflict:
    name: Report stable-sync conflict
    needs: prepare
    if: needs.prepare.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      CONFLICTS_B64: ${{ needs.prepare.outputs.conflicts-b64 }}
    steps:
      - name: Record conflict and fail truthfully
        shell: bash
        run: |
          set -euo pipefail
          conflicts=$(printf '%s' "$CONFLICTS_B64" | base64 --decode)
          title="ODS upstream sync conflict"
          body_file="$RUNNER_TEMP/ods-upstream-conflict.md"
          # Markdown backticks are intentionally literal.
          # shellcheck disable=SC2016
          printf 'The stable upstream review merge stopped without changing `%s`.\n\n- Upstream: `%s@%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n%s\n```\n' \
            "$DOWNSTREAM_BRANCH" "$UPSTREAM_REPOSITORY" "$UPSTREAM_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$conflicts" > "$body_file"
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues)
          if [[ "$has_issues" == "true" ]]; then
            issue_number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
            if [[ -n "$issue_number" ]]; then gh issue comment "$issue_number" --body-file "$body_file"; else gh issue create --title "$title" --body-file "$body_file"; fi
          fi
          exit 1
