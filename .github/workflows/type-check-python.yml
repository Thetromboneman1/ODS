name: Python Type Check

on:
  push:
    branches: [main, boneman/macos-omlx]
    paths:
      - "ods/**/*.py"
      - "ods/extensions/services/**/requirements*.txt"
      - ".github/workflows/type-check-python.yml"
  pull_request:
    branches: [main, boneman/macos-omlx]
    paths:
      - "ods/**/*.py"
      - "ods/extensions/services/**/requirements*.txt"
      - ".github/workflows/type-check-python.yml"

permissions:
  contents: read

jobs:
  mypy:
    name: Type check ${{ matrix.service }} with mypy
    runs-on: ubuntu-latest
    strategy:
      # Report every service's result even when another service has type errors.
      fail-fast: false
      matrix:
        include:
          - service: dashboard-api
            directory: ods/extensions/services/dashboard-api
          - service: token-spy
            directory: ods/extensions/services/token-spy
          - service: privacy-shield
            directory: ods/extensions/services/privacy-shield
          - service: scripts
            directory: ods/scripts
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Install service dependencies
        if: matrix.service != 'scripts'
        run: pip install -r requirements.txt

      - name: Type check service
        if: matrix.service != 'scripts'
        run: mypy . --ignore-missing-imports --no-strict-optional --check-untyped-defs

      - name: Type check scripts
        if: matrix.service == 'scripts'
        run: mypy *.py --ignore-missing-imports --no-strict-optional --check-untyped-defs
